{% extends 'base.html' %}

{% block content %}
  <h1>Summarise your text</h1>
  <p class="subtitle">Paste an article or a few paragraphs and get the most important sentences back.</p>

  <form id="summary-form" method="post" action="{{ url_for('pages.home') }}">
    <label for="text-input">Text to summarise</label>
    <textarea id="text-input" name="text" placeholder="Paste your text here" required>{{ text or '' }}</textarea>
    <button type="submit" id="submit-btn">Generate Summary</button>
  </form>
{% endblock %}
