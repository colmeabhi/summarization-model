<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Summary Generator{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body>
    <header class="navbar">
      <div class="navbar-inner">
        <a class="logo" href="{{ url_for('pages.home') }}">Summary Generator</a>
        <nav>
          <a href="{{ url_for('pages.home') }}" class="{{ 'active' if active_page == 'home' }}">Summarise</a>
          <a href="{{ url_for('pages.how_it_works') }}" class="{{ 'active' if active_page == 'how' }}">How it works</a>
          <a href="{{ url_for('pages.about') }}" class="{{ 'active' if active_page == 'about' }}">About</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <p>Extractive text summariser made with Flask, NLTK and scikit-learn.</p>
    </footer>

    {% block scripts %}{% endblock %}
  </body>
</html>
